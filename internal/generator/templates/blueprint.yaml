name: "Standard Hexagonal"
version: "1.0.0"
base_path: "."
templates:
  - name: "go_mod"
    source: "base/go.mod.tmpl"
    target: "go.mod"
  - name: "main"
    source: "base/main.go.tmpl"
    target: "main.go"
  - name: "module_model"
    source: "modules/model.go.tmpl"
    target: "internal/modules/{{.PackageName}}/model.go"
  - name: "module_repository"
    source: "modules/repository.go.tmpl"
    target: "internal/modules/{{.PackageName}}/repository.go"
  - name: "module_service"
    source: "modules/service.go.tmpl"
    target: "internal/modules/{{.PackageName}}/service.go"
  - name: "module_handler"
    source: "modules/handler.go.tmpl"
    target: "internal/modules/{{.PackageName}}/handler.go"
  - name: "core_model"
    source: "core/model.go.tmpl"
    target: "model/{{.ToLower .Name}}.go"
  - name: "core_repository"
    source: "core/repository.go.tmpl"
    target: "repository/{{.ToLower .Name}}.go"
  - name: "core_service"
    source: "core/service.go.tmpl"
    target: "service/{{.ToLower .Name}}.go"
  - name: "core_handler"
    source: "core/handler.go.tmpl"
    target: "transport/http/handler/{{.ToLower .Name}}.go"
